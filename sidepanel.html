      var _busy = false;

      function walkAndReplace() {
        if (_busy) return;
        _busy = true;
        try {
          var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
          var node;
          while ((node = walker.nextNode())) {
            var orig = node.nodeValue;
            if (!orig || !orig.trim()) continue;
            var val = orig;
            for (var i = 0; i < PT_EN.length; i++) {
              if (val.includes(PT_EN[i][0])) {
                val = val.split(PT_EN[i][0]).join(PT_EN[i][1]);
              }
            }
            // Fix "✕ undefined" → "✗ Incorrect"
            if (/[✕✗xX×]\s*undefined/.test(val)) {
              val = val.replace(/[✕✗xX×]\s*undefined/g, '✗ Incorrect');
              if (node.parentElement) node.parentElement.style.color = '#f87171';
            }
            if (val.trim() === 'undefined') val = 'Incorrect';
            if (val !== orig) node.nodeValue = val;
          }
        } finally {
          _busy = false;
        }
      }

      walkAndReplace();
      new MutationObserver(walkAndReplace).observe(document.body, { childList: true, subtree: true });
    })();

    // Hide unwanted buttons by text content — language-agnostic, catches PT/EN/any
    (function () {
      var HIDDEN_PHRASES = [
        'standard chat', 'native chat', 'use standard',
        'usar chat', 'chat padr',   // Portuguese variants
        'enable shield', 'escudo',  // Shield button EN + PT
        'ativar escudo', 'shield'
      ];
      function shouldHide(text) {
        var t = text.trim().toLowerCase();
        return HIDDEN_PHRASES.some(function (p) { return t.includes(p); });
      }
      function hideButtons() {
        document.querySelectorAll('button, a[role="button"]').forEach(function (el) {
          if (shouldHide(el.textContent)) {
            el.style.setProperty('display', 'none', 'important');
          }
        });
      }
      hideButtons();
      new MutationObserver(hideButtons).observe(document.body, { childList: true, subtree: true });
    })();

  <script>
    // ── Force English: patch chrome.storage.local.get BEFORE i18n.js reads it ──
    (function forceEnglish() {
      function patchStorage(storage) {
        if (!storage || storage.__qlLangPatched) return;
        storage.__qlLangPatched = true;
        // Write 'en' immediately
        try { storage.set({ ql_lang: 'en' }); } catch(e) {}
        // Intercept every .get call to inject ql_lang:'en'
        var _origGet = storage.get.bind(storage);
        storage.get = function(keys, cb) {
          var result = _origGet(keys, function(res) {
            if (res && typeof res === 'object') res.ql_lang = 'en';
            if (cb) cb(res);
          });
          // Promise path
          if (result && typeof result.then === 'function') {
            return result.then(function(res) {
              if (res && typeof res === 'object') res.ql_lang = 'en';
              return res;
            });
          }
          return result;
        };
      }

      // Patch immediately if chrome is already available (real extension)
      try {
        if (typeof chrome !== 'undefined' && chrome.storage) {
          patchStorage(chrome.storage.local);
          patchStorage(chrome.storage.sync);
        }
      } catch(e) {}

      // Also patch after chrome-mock.js sets up the mock (preview mode)
      document.addEventListener('DOMContentLoaded', function() {
        try {
          if (typeof chrome !== 'undefined' && chrome.storage) {
            patchStorage(chrome.storage.local);
            patchStorage(chrome.storage.sync);
          }
        } catch(e) {}
      });

      // Patch sessionStorage reads
      try {
        var _ssGet = sessionStorage.getItem.bind(sessionStorage);
        sessionStorage.getItem = function(key) {
          if (key && key.toLowerCase().includes('lang')) return 'en';
          return _ssGet(key);
        };
        sessionStorage.setItem = (function(_orig) {
          return function(key, val) {
            if (key && key.toLowerCase().includes('lang')) val = 'en';
            return _orig(key, val);
          };
        })(sessionStorage.setItem.bind(sessionStorage));
      } catch(e) {}

      // Patch navigator.language fallback
      try {
        Object.defineProperty(navigator, 'language',  { get: function(){ return 'en'; }, configurable: true });
        Object.defineProperty(navigator, 'languages', { get: function(){ return ['en','en-US']; }, configurable: true });
      } catch(e) {}
    })();
  </script>

            img.style.width = '110px';
            img.style.height = '110px';
            img.style.borderRadius = '0';
            img.style.background = 'transparent';
          }
          // Strip white background from icon wrapper
          if (img.parentElement) {
            img.parentElement.style.background = 'transparent';
            img.parentElement.style.boxShadow = 'none';
            img.parentElement.style.border = 'none';
          }
        });
      }

      // Watch for any DOM or attribute changes inside the body
      const observer = new MutationObserver(() => swapBodyIcons());
      observer.observe(document.body, {
        childList: true, subtree: true, attributes: true, attributeFilter: ['src']
      });

      // Also poll as a safety net
      const interval = setInterval(swapBodyIcons, 300);
      setTimeout(() => clearInterval(interval), 10000);

      document.addEventListener('DOMContentLoaded', swapBodyIcons);
    })();
  </script>
  <script>
    // Aggressively remove the PLAN toggle button regardless of when it's injected
    (function() {
      function removePlanBtn() {
        document.querySelectorAll('div.sp-action-left, [class*="plano"],[class*="modo-plan"],[id*="plano"],[id*="modo-plan"]').forEach(function(el) {
          el.remove();
        });
        document.querySelectorAll('button, label, div, span').forEach(function(el) {
          if (el.textContent && el.textContent.trim() === 'PLAN') {
            var parent = el.closest('[class*="plano"],[class*="plan"]') || el.parentElement;
            if (parent) parent.remove(); else el.remove();
          }
        });
      }
      removePlanBtn();
      new MutationObserver(removePlanBtn).observe(document.body, { childList: true, subtree: true });
    })();
  </script>
  <script>
    // Show bell + logout only after the license gate is gone (user logged in)
    (function() {
      function unlockHeaderBtns() {
        var gate = document.querySelector('.sp-license-gate');
        if (!gate || gate.offsetParent === null || gate.style.display === 'none' || !document.body.contains(gate)) {
          document.querySelectorAll('.sp-notif-btn, .sp-logout-btn').forEach(function(btn) {
            btn.classList.add('sp-unlocked');
          });
          obs.disconnect();
        }
      }
      var obs = new MutationObserver(unlockHeaderBtns);
      obs.observe(document.body, { childList: true, subtree: true, attributes: true });
      unlockHeaderBtns();
    })();
  </script>
</body>
</html>
